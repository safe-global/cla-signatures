name: Sync CLA Signatures to Main

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN can't open PRs (org setting can_approve_pull_request_reviews: false, kept off on
      # purpose), so the PR is opened by the safe-cla-bot App, which is installed only on this repo.
      - name: Mint safe-cla-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: safe-global
          repositories: cla-signatures
          permission-contents: read
          permission-pull-requests: write

      - name: Check for pending signatures
        id: check
        run: |
          AHEAD=$(gh api repos/safe-global/cla-signatures/compare/main...signatures --jq '.ahead_by')
          echo "ahead_by=$AHEAD" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create PR for pending signatures
        if: steps.check.outputs.ahead_by != '0'
        run: |
          EXISTING=$(gh pr list \
            --repo safe-global/cla-signatures \
            --head signatures \
            --base main \
            --json number \
            --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo safe-global/cla-signatures \
              --base main \
              --head signatures \
              --title "chore: Merge pending CLA signatures" \
              --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY: |
            ${{ steps.check.outputs.ahead_by }} commit(s) with new CLA signatures pending review.

            Merge with **Create a merge commit**. Squash and rebase rewrite the commits and leave `signatures` behind `main`.

            cc @safe-global/platform-team
